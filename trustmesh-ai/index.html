<!doctype html>
<html lang="en">
<head>

<title>TrustMesh AI — Sovereign Intelligence</title>
<style>
:root{--bg:#050b14;--line:#19364d;--text:#eef7ff;--muted:#8ea5bb;--cyan:#14d9ff;--violet:#7654ff;--green:#35e2a2;--amber:#ffc857;--red:#ff5877;--shadow:0 20px 60px rgba(0,0,0,.28)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 70% -10%,#102946 0,#07111f 34%,#050b14 70%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button,a{touch-action:manipulation}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}aside{position:sticky;top:0;height:100vh;border-right:1px solid #12283b;background:rgba(5,12,21,.92);backdrop-filter:blur(18px);padding:24px 16px;display:flex;flex-direction:column;z-index:20}.brand{display:flex;align-items:center;gap:10px;color:var(--text);text-decoration:none;font-size:19px;font-weight:800;padding:6px 8px}.brand b{color:var(--cyan)}.logo{width:36px;height:36px;flex:none}.pill{margin:22px 7px 16px;padding:8px 10px;border:1px solid #17425a;background:#071927;border-radius:999px;color:#91afc4;font-size:10px;font-weight:800;letter-spacing:.12em}.pill i,.secure i,.node-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 12px rgba(53,226,162,.75);margin-right:7px}nav{display:grid;gap:5px}nav a{display:flex;gap:11px;align-items:center;padding:11px 12px;border-radius:10px;color:#8fa6ba;text-decoration:none;font-size:13px;font-weight:650}nav a:hover{background:#0b1b2a;color:#dff6ff}nav a.active{background:linear-gradient(90deg,#0d2a3c,#101d32);color:#fff;border:1px solid #16435b;box-shadow:inset 3px 0 var(--cyan)}nav a span{width:20px;text-align:center;color:var(--cyan)}.sidefoot{margin-top:auto;padding:15px 8px;border-top:1px solid #14283a;color:var(--muted);display:grid;gap:4px;font-size:11px}.sidefoot strong{color:#dcebf5}.sidefoot small{margin-top:8px;color:#587389}.main{min-width:0}header{height:74px;border-bottom:1px solid #11283b;background:rgba(5,12,21,.65);backdrop-filter:blur(18px);display:flex;justify-content:space-between;align-items:center;padding:0 36px;position:sticky;top:0;z-index:15}header small,.kicker{color:#62cbe8;font-size:10px;font-weight:850;letter-spacing:.16em}header h1{font-size:16px;margin:3px 0 0}header em{font-style:normal;color:var(--cyan)}.actions,.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.secure{font-size:11px;color:var(--muted)}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid #244b63;background:#091522;color:#eef7ff;text-decoration:none;border-radius:9px;padding:10px 13px;font-size:12px;font-weight:800;cursor:pointer;min-height:40px}.btn:hover{border-color:#3c7594;background:#0c1e2d}.btn.primary{border:0;background:linear-gradient(135deg,#08cfea,#376eff);box-shadow:0 8px 26px rgba(20,170,255,.18)}.content{max-width:1440px;margin:0 auto;padding:0 36px}.title{padding-top:30px}.title h2{font-size:30px;letter-spacing:-.035em;margin:7px 0}.title p{margin:0;color:var(--muted);max-width:760px;line-height:1.65}.hero{margin-top:28px;min-height:440px;border:1px solid #17354b;border-radius:20px;overflow:hidden;background:radial-gradient(circle at 75% 30%,rgba(35,111,255,.2),transparent 28%),radial-gradient(circle at 65% 70%,rgba(20,217,255,.12),transparent 25%),linear-gradient(135deg,#071521,#091b2b 60%,#0b1726);position:relative;padding:70px 62px;box-shadow:var(--shadow)}.hero:after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(75,160,210,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(75,160,210,.07) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(90deg,black,transparent 80%);pointer-events:none}.hero>div{max-width:720px;position:relative;z-index:1}.hero h2{font-size:clamp(42px,5vw,74px);line-height:.98;letter-spacing:-.055em;margin:14px 0 20px}.hero h2 b{color:var(--cyan)}.hero p{color:#a9bfd0;line-height:1.7;font-size:15px;max-width:620px}.notice{margin-top:18px;border:1px solid #1b4057;background:rgba(5,19,31,.7);padding:12px 14px;border-radius:10px;color:#9bb2c3;font-size:11px;line-height:1.6}.notice strong{color:#d9f5ff}.section{margin-top:24px}.sectionhead{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:15px}.sectionhead h3{margin:2px 0 4px;font-size:18px}.sectionhead p{margin:0;color:var(--muted);font-size:11px}.grid{display:grid;gap:14px}.four{grid-template-columns:repeat(4,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card{border:1px solid var(--line);background:linear-gradient(180deg,rgba(10,26,41,.94),rgba(7,19,31,.96));border-radius:14px;padding:19px;box-shadow:0 12px 40px rgba(0,0,0,.12)}.feature{min-height:170px}.feature .ico{font-size:19px;color:var(--cyan)}.feature h4{margin:15px 0 7px}.feature p,.card p{color:var(--muted);font-size:12px;line-height:1.65}.metric{min-height:120px}.metric small{display:block;color:#7f98ad;font-size:10px;text-transform:uppercase;letter-spacing:.12em}.metric strong{display:block;font-size:29px;margin:8px 0}.metric em{font-style:normal;color:var(--green);font-size:10px}.form{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:18px 0}.field{display:grid;gap:7px}.field span{font-size:10px;color:#86a0b4;text-transform:uppercase;letter-spacing:.08em}.field input,.field select{width:100%;height:42px;background:#07131f;color:#eef7ff;border:1px solid #21445a;border-radius:8px;padding:0 11px;outline:none}.field input:focus,.field select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(20,217,255,.1)}.presetbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.preset{border:1px solid #21465e;background:#081725;color:#b8ccda;border-radius:999px;padding:7px 11px;font-size:10px;font-weight:800;cursor:pointer}.preset:hover{border-color:#2c91b8;color:#e8fbff;background:#0b2535}.node,.event,.agent,.audit{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #132a3d}.node:last-child,.event:last-child,.agent:last-child,.audit:last-child{border-bottom:0}.node>div,.event>div,.agent>div:first-child,.audit>div{display:grid;gap:4px}.node strong,.event strong,.agent strong,.audit strong{font-size:12px}.node small,.event small,.agent small,.audit small{font-size:10px;color:#7891a6}.tag{border:1px solid #24536b;background:#0a1d2b;border-radius:999px;padding:5px 8px;color:#8fc9dd;font-size:9px;font-weight:850;white-space:nowrap}.tag.block{color:#ff91a5;border-color:#6b2d3e}.tag.review{color:#ffd46d;border-color:#695528}.tag.allow{color:#64e6b5;border-color:#2c6752}.node{grid-template-columns:1fr auto}.node i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px rgba(53,226,162,.6);margin-right:7px}.event{grid-template-columns:auto 1fr auto}.event>i{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px rgba(20,217,255,.5)}.decision{border:1px solid #23465c;background:#071725;border-radius:13px;padding:22px;margin-top:8px}.decision.block{border-color:#6a3040;background:linear-gradient(180deg,#1b1019,#0a1825)}.big{font-size:31px;font-weight:900;letter-spacing:-.04em;margin:7px 0}.decision.block .big{color:#ff718e}.risk{height:9px;background:#13263a;border-radius:9px;overflow:hidden;margin:13px 0}.risk span{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--amber),var(--red));border-radius:inherit}.hash{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;line-height:1.6;color:#83cbe2;background:#040c14;border:1px solid #17364a;border-radius:8px;padding:10px;word-break:break-all}.bar{height:7px;min-width:120px;background:#122638;border-radius:8px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet))}.agent{grid-template-columns:minmax(180px,1.5fr) minmax(100px,1fr) 32px 70px}.agent em{font-style:normal;color:var(--green);font-size:9px;text-align:right}.diagram{height:360px;position:relative;overflow:hidden;background:radial-gradient(circle at center,rgba(42,117,255,.18),transparent 35%),#071521}.ring{position:absolute;width:230px;height:230px;border:1px dashed #1d6181;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 0 60px rgba(20,217,255,.08)}.ring:before,.ring:after{content:"";position:absolute;border:1px solid #214e68;border-radius:50%;inset:26px}.ring:after{inset:54px}.core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;font-size:10px;letter-spacing:.16em;line-height:1.45}.core b{font-size:18px;color:var(--cyan)}.bubble{position:absolute;border:1px solid #245570;background:#091d2d;padding:10px 13px;border-radius:10px;font-size:11px;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,.2)}.bubble small{display:block;color:#7291a5;font-size:9px;margin-top:3px}.bubble.top{top:25px;left:50%;transform:translateX(-50%)}.bubble.left{left:14%;top:52%;transform:translateY(-50%)}.bubble.right{right:14%;top:52%;transform:translateY(-50%)}.checkline{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #142b3d;font-size:11px}.checkline:last-child{border-bottom:0}.ok{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}.terminal{background:#040b12;border:1px solid #153247;border-radius:10px;padding:13px;color:#83bdd0;font:10px/1.7 ui-monospace,monospace;white-space:pre-wrap;min-height:110px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.footer{max-width:1440px;margin:30px auto;padding:0 36px 28px;color:#526a7e;font-size:10px}.mobile-menu{display:none}@media(max-width:1100px){.four{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:repeat(3,1fr)}.agent{grid-template-columns:1fr 1fr 32px 70px}}@media(max-width:820px){.app{grid-template-columns:1fr}aside{position:fixed;left:0;right:0;top:0;height:auto;display:none;border-right:0;border-bottom:1px solid #173248;padding:12px 14px}.app.menu-open aside{display:flex}.app.menu-open aside .sidefoot{display:none}nav{grid-template-columns:repeat(2,1fr)}.pill{margin:8px 0}.mobile-menu{display:flex}header{padding:0 18px;height:66px}.actions .secure{display:none}.content{padding:0 18px}.footer{padding:0 18px 24px}.hero{padding:42px 25px;min-height:420px}.hero h2{font-size:44px}.four,.three,.two{grid-template-columns:1fr}.form{grid-template-columns:1fr 1fr}.agent{grid-template-columns:1fr 1fr}.agent em{display:none}.diagram{height:330px}.bubble.left{left:5%}.bubble.right{right:5%}}@media(max-width:520px){.form{grid-template-columns:1fr}.hero h2{font-size:38px}.title h2{font-size:26px}.header-title{display:none}.btn{padding:9px 11px}.bar{min-width:70px}.bubble{font-size:9px;padding:8px}.content{padding:0 14px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(()=>{'use strict';
const STORAGE='trustmesh-events-v4',RESULT='trustmesh-result-v4',MESH='trustmesh-mesh-v4';
const safeRead=(k,f)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):f}catch{return f}};
const clamp=n=>Math.max(0,Math.min(100,Math.round(Number(n)||0)));
const uid=()=>globalThis.crypto?.randomUUID?crypto.randomUUID():`${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}`;
let state={route:'overview',events:safeRead(STORAGE,[]),result:safeRead(RESULT,null),mesh:safeRead(MESH,{round:0,anomaly:false,log:['[BOOT] TrustMesh control plane ready','[POLICY] Approved signals only','[AUDIT] SHA-256 commitments enabled']}),loading:false,form:{amount:50000,country:'Unknown',device:true,age:2,velocity:6}};
const nav=[['overview','⌂','Overview'],['dashboard','◈','Dashboard'],['simulation','⚡','Simulation'],['agents','◎','Agent Center'],['decision','◆','Decision'],['audit','✓','Audit Center'],['architecture','⌘','Architecture'],['security','◉','Security'],['enterprise','⬡','Enterprise']];
function route(){return(location.hash.replace(/^#\/?/,'')||'overview').split('?')[0]}
addEventListener('hashchange',()=>{state.route=route();render()});
function save(){localStorage.setItem(STORAGE,JSON.stringify(state.events));localStorage.setItem(RESULT,JSON.stringify(state.result));localStorage.setItem(MESH,JSON.stringify(state.mesh))}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function analyze(e){const fraud=clamp((e.amount>=25000?30:10)+(e.amount>=75000?12:0)+(e.device?22:0)+(e.country==='Unknown'?16:e.country==='Sanctioned'?30:4)+(e.age<=7?17:5)+(e.velocity>=4?12:e.velocity>=2?6:2));const risk=clamp((e.device?24:7)+(e.country==='Unknown'?18:e.country==='Sanctioned'?35:4)+(e.velocity>=5?27:e.velocity>=3?18:6)+(e.age<=7?20:5)+(e.amount>=25000?11:3));const compliance=e.country!=='Sanctioned'&&e.amount<100000;const complianceScore=compliance?8:96;const finalScore=clamp(fraud*.5+risk*.35+complianceScore*.15);const decision=finalScore>=70?'BLOCK':finalScore>=50?'REVIEW':'ALLOW';const confidence=clamp(74+Math.abs(finalScore-50)*.52);const analyses=[{agent:'Fraud Agent',score:fraud,reason:`Transaction patterns: amount, velocity, geography and account age → ${fraud}/100.`},{agent:'Risk Agent',score:risk,reason:`Risk context: device, country, velocity and behaviour → ${risk}/100.`},{agent:'Compliance Agent',score:complianceScore,reason:compliance?'No simulated policy veto.':'Sanctions / threshold policy triggered a compliance hold.'}];return{analyses,finalScore,decision,confidence,compliance}}
async function sha256(value){if(!globalThis.crypto?.subtle)throw new Error('Web Crypto is unavailable in this browser.');const bytes=new TextEncoder().encode(value),digest=await crypto.subtle.digest('SHA-256',bytes);return Array.from(new Uint8Array(digest),x=>x.toString(16).padStart(2,'0')).join('')}
async function runSimulation(){if(state.loading)return;const f={amount:Math.max(1,Number(state.form.amount)||0),country:state.form.country,device:Boolean(state.form.device),age:Math.max(0,Number(state.form.age)||0),velocity:Math.max(0,Number(state.form.velocity)||0)};state.loading=true;render();await new Promise(r=>setTimeout(r,260));try{const event={id:uid(),...f,created_at:new Date().toISOString()},result=analyze(event);result.event=event;const canonical=JSON.stringify({protocol:'TrustMesh-Audit-v4',event,analyses:result.analyses,finalScore:result.finalScore,decision:result.decision,confidence:result.confidence});result.hash=await sha256(canonical);result.protocol='TrustMesh-Audit-v4';state.result=result;state.events=[{id:event.id,amount:event.amount,country:event.country,decision:result.decision,score:result.finalScore,confidence:result.confidence,hash:result.hash,time:event.created_at},...state.events].slice(0,100);save();state.loading=false;location.hash='/decision'}catch(err){state.loading=false;render();alert(err.message||'Simulation failed.')}}
function resetData(){state.events=[];state.result=null;save();render()}
function preset(name){const p={low:{amount:1200,country:'Argentina',device:false,age:420,velocity:1},review:{amount:28000,country:'Unknown',device:false,age:18,velocity:3},high:{amount:125000,country:'Unknown',device:true,age:2,velocity:7}}[name];if(p){state.form={...p};state.result=null;render()}}
function scoreTag(d){return`<span class="tag ${d.toLowerCase()}">${d}</span>`}
function logo(){return`<svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 3 56 16v20c0 12-9 20-24 25C17 56 8 48 8 36V16L32 3Z" fill="none" stroke="#14d9ff" stroke-width="3"/><circle cx="32" cy="19" r="6" fill="#14d9ff"/><circle cx="18" cy="42" r="6" fill="#397bff"/><circle cx="46" cy="42" r="6" fill="#7654ff"/><circle cx="32" cy="33" r="4" fill="#fff"/><path d="M32 25v4M27 35l-7 5M37 35l7 5M24 42h16" stroke="#14d9ff" stroke-width="2"/></svg>`}
function shell(content){return`<div class="app" id="shell"><aside><a class="brand" href="#/overview">${logo()}<span>TrustMesh <b>AI</b></span></a><div class="pill"><i></i> NETWORK ONLINE</div><nav>${nav.map(([k,i,l])=>`<a href="#/${k}" class="${state.route===k?'active':''}"><span>${i}</span>${l}</a>`).join('')}</nav><div class="sidefoot"><strong>Move intelligence.</strong><span>Not sensitive data.</span><small>Hackathon MVP • by ElCryptoBoy</small></div></aside><main class="main"><header><div class="header-title"><small>SOVEREIGN INTELLIGENCE</small><h1>TrustMesh <em>AI</em></h1></div><div class="actions"><span class="secure"><i></i>Privacy-first simulation</span><a class="btn primary" href="#/simulation">Run demo →</a><button class="btn mobile-menu" id="menu">☰</button></div></header>${content}<div class="footer">TrustMesh AI • Functional browser MVP • Synthetic data only • No live banking decisions</div></main></div>`}
function title(k,t,d){return`<div class="content title"><span class="kicker">${k}</span><h2>${t}</h2><p>${d}</p></div>`}function metric(l,v,s){return`<div class="card metric"><small>${l}</small><strong>${v}</strong><em>● ${s}</em></div>`}function info(t,d){return`<div><strong>${t}</strong><p>${d}</p></div>`}function feature(i,t,d){return`<div class="card feature"><span class="ico">${i}</span><h4>${t}</h4><p>${d}</p></div>`}
function overview(){return`<div class="content"><section class="hero"><div><span class="kicker">COLLABORATIVE AI FOR REGULATED INDUSTRIES</span><h2>Move <b>intelligence.</b><br>Not sensitive data.</h2><p>TrustMesh AI is a sovereign intelligence layer for organizations that need collaborative fraud decisions without centralizing sensitive records.</p><div class="row"><a class="btn primary" href="#/simulation">Launch live demo →</a><a class="btn" href="#/architecture">See architecture</a></div><div class="notice"><strong>Functional demo:</strong> generate synthetic events, run independent agents, produce consensus, verify the SHA-256 commitment and export the audit record. Everything persists locally in this browser.</div></div></section><section class="section"><div class="grid four">${feature('◈','Data sovereignty','The demo never sends transaction inputs to a third-party API. Raw event data stays in local browser storage.')}${feature('◎','Multi-agent reasoning','Fraud, risk and compliance scores are calculated independently before consensus.')}${feature('⚡','Operational control','Simulation, decision, audit and enterprise control-plane actions are all interactive.')}${feature('✓','Cryptographic proof','The decision payload is canonicalized and committed with SHA-256 using Web Crypto.')}</div></section><section class="section"><div class="sectionhead"><div><span class="kicker">NETWORK</span><h3>Three institutions. One intelligence layer.</h3></div><a class="btn" href="#/dashboard">Open dashboard →</a></div><div class="grid three">${feature('01','Bank Alpha','Local inference node. Sensitive records remain inside the institution boundary.')}${feature('02','Bank Beta','Independent signal contributor with its own risk context and policy state.')}${feature('03','Bank Gamma','Compliance-oriented node that can escalate or veto a decision.')}</div></section></div>`}
function dashboard(){const blocks=state.events.filter(e=>e.decision==='BLOCK').length,reviews=state.events.filter(e=>e.decision==='REVIEW').length,avg=state.events.length?Math.round(state.events.reduce((a,e)=>a+e.score,0)/state.events.length):0;return`<div>${title('CONTROL PLANE','Network Dashboard','Operational view of the TrustMesh collaborative fraud simulation.')}<div class="content"><div class="grid four">${metric('Nodes connected','3/3','All nodes healthy')}${metric('Events analyzed',state.events.length,'Local demo ledger')}${metric('Blocked',blocks,'Consensus BLOCK')}${metric('Average risk',avg+'/100',reviews+' review events')}</div><div class="section grid two"><div class="card"><div class="sectionhead"><div><h3>Connected institutions</h3><p>Independent inference nodes</p></div><span class="tag">ONLINE</span></div>${['Bank Alpha','Bank Beta','Bank Gamma'].map(n=>`<div class="node"><div><strong><i></i>${n}</strong><small>Local inference • data retained</small></div><span class="tag">HEALTHY</span></div>`).join('')}</div><div class="card"><div class="sectionhead"><div><h3>Activity feed</h3><p>Latest decisions</p></div><a class="btn" href="#/audit">Full audit</a></div>${state.events.length?state.events.slice(0,7).map(e=>`<div class="event"><i></i><div><strong>Transaction #${escapeHtml(e.id.slice(-8))}</strong><small>$${Number(e.amount).toLocaleString()} • risk ${e.score}/100 • ${e.confidence}% confidence</small></div>${scoreTag(e.decision)}</div>`).join(''):`<div class="notice">No events yet. Launch the simulation to create your first decision.</div>`}</div></div><div class="card section"><div class="sectionhead"><div><h3>Control-plane guarantees</h3><p>What the current MVP actually does</p></div></div><div class="grid three">${info('Local execution','All fraud/risk/compliance calculations run in the browser. No API key is required.')}${info('Policy-aware','Compliance is a separate score and can materially change the final action.')}${info('Replayable audit','Each stored decision contains its event, score, confidence, timestamp and hash.')}</div></div></div></div>`}
function simulation(){const f=state.form;return`<div>${title('EVENT SIMULATOR','Fraud Decision Lab','Generate a synthetic transaction and watch four logical agents collaborate.')}<div class="content"><div class="card"><div class="sectionhead"><div><h3>Scenario presets</h3><p>Use these to validate the full decision pipeline quickly.</p></div><span class="tag">SYNTHETIC ONLY</span></div><div class="presetbar"><button class="preset" data-preset="low">Low risk</button><button class="preset" data-preset="review">Review</button><button class="preset" data-preset="high">High risk</button></div><div class="form"><label class="field"><span>Amount USD</span><input id="amount" type="number" min="1" value="${f.amount}"></label><label class="field"><span>Country</span><select id="country"><option ${f.country==='Unknown'?'selected':''}>Unknown</option><option ${f.country==='Argentina'?'selected':''}>Argentina</option><option ${f.country==='United States'?'selected':''}>United States</option><option ${f.country==='Sanctioned'?'selected':''}>Sanctioned</option></select></label><label class="field"><span>New device</span><select id="device"><option value="true" ${f.device?'selected':''}>Yes</option><option value="false" ${!f.device?'selected':''}>No</option></select></label><label class="field"><span>Account age / days</span><input id="age" type="number" min="0" value="${f.age}"></label><label class="field"><span>Velocity / hour</span><input id="velocity" type="number" min="0" value="${f.velocity}"></label></div><div class="row"><button id="run" class="btn primary">${state.loading?'Running agents…':'Generate Fraud Event →'}</button><a class="btn" href="#/agents">Open Agent Center →</a><a class="btn" href="#/decision">Latest decision</a></div></div><div class="section grid three">${info('Step 1','Event created locally from the form above.')}${info('Step 2','Fraud, Risk and Compliance agents score independently.')}${info('Step 3','Consensus + SHA-256 commitment are stored in the audit ledger.')}</div></div></div>`}
function agents(r=state.result){const a=r?.analyses||[{agent:'Fraud Agent',score:91,reason:'Pattern analysis ready.'},{agent:'Risk Agent',score:78,reason:'Context analysis ready.'},{agent:'Compliance Agent',score:12,reason:'Policy analysis ready.'}],all=[...a,{agent:'Consensus Agent',score:r?.finalScore??0,reason:r?'Weighted policy-aware output.':'Waiting for a transaction.'}];return all.map(x=>`<div class="agent"><div><strong>${escapeHtml(x.agent)}</strong><small>${escapeHtml(x.reason)}</small></div><div class="bar"><span style="width:${x.score}%"></span></div><strong>${x.score}</strong><em>${r?'COMPLETE':'READY'}</em></div>`).join('')}
function agentPage(){return`<div>${title('MULTI-AGENT ORCHESTRATION','Agent Center','Independent node signals are visible before the final consensus decision.')}<div class="content"><div class="card diagram"><div class="ring"></div><div class="core">TRUST<br><b>MESH</b><br>CONSENSUS</div><div class="bubble top">Bank Alpha<small>local node</small></div><div class="bubble left">Bank Beta<small>local node</small></div><div class="bubble right">Bank Gamma<small>local node</small></div></div><div class="card section"><div class="sectionhead"><div><h3>Current agent state</h3><p>${state.result?'Latest transaction analysis':'Run a simulation to populate live scores'}</p></div><a class="btn" href="#/simulation">Run event</a></div>${agents()}</div><div class="grid three section">${info('Independent signals','Fraud and risk are separate assessments. No single score silently controls the whole decision.')}${info('Compliance veto','A policy score can push the decision into REVIEW or BLOCK independently of fraud likelihood.')}${info('Production path','Replace deterministic functions with institution-local models, secure aggregation and signed attestations.')}</div></div></div>`}
function decision(){const r=state.result;if(!r)return`<div>${title('DECISION CENTER','No decision yet','Run a simulation first. The result will appear here with score, confidence, reasoning and cryptographic commitment.')}<div class="content"><div class="card"><a class="btn primary" href="#/simulation">Create first decision →</a></div></div></div>`;return`<div>${title('DECISION CENTER','Consensus Decision','One policy-aware action assembled from independent agent signals.')}<div class="content"><div class="grid two"><div class="card"><div class="sectionhead"><div><h3>Final action</h3><p>Transaction #${escapeHtml(r.event.id.slice(-8))}</p></div>${scoreTag(r.decision)}</div><div class="decision ${r.decision==='BLOCK'?'block':''}"><span class="kicker">FINAL ACTION</span><div class="big">${r.decision} TRANSACTION</div><p>Composite risk <strong>${r.finalScore}/100</strong> • confidence <strong>${r.confidence}%</strong></p><div class="risk"><span style="width:${r.finalScore}%"></span></div><small>Deterministic demo model. This is not a live banking decision engine.</small></div></div><div class="card"><div class="sectionhead"><div><h3>Cryptographic commitment</h3><p>SHA-256 / TrustMesh-Audit-v4</p></div><span class="tag">VERIFIABLE</span></div><div class="hash">${r.hash}</div><div class="toolbar" style="margin-top:12px"><button class="btn primary" id="verify">Verify integrity</button><button class="btn" id="export">Export JSON</button><a class="btn" href="#/audit">Open audit</a></div><div id="verifyResult" class="notice">Verification has not been run yet.</div></div></div><div class="card section"><div class="sectionhead"><div><h3>Agent lineage</h3><p>Independent scores → weighted consensus</p></div></div>${agents(r)}</div><div class="card section"><div class="sectionhead"><div><h3>Decision explanation</h3><p>What drove the output</p></div></div><div class="grid three">${info('Fraud signal',r.analyses[0].reason)}${info('Risk signal',r.analyses[1].reason)}${info('Compliance',r.analyses[2].reason)}</div></div></div></div>`}
async function verify(){const r=state.result;if(!r)return;const canonical=JSON.stringify({protocol:r.protocol,event:r.event,analyses:r.analyses,finalScore:r.finalScore,decision:r.decision,confidence:r.confidence}),h=await sha256(canonical),ok=h===r.hash,el=document.getElementById('verifyResult');if(el)el.innerHTML=ok?'<strong class="ok">✓ Integrity verified.</strong> The recomputed SHA-256 exactly matches the stored commitment.':'<strong class="bad">✕ Integrity mismatch.</strong> The stored decision does not match its commitment.'}
function downloadJSON(){if(!state.result)return;const blob=new Blob([JSON.stringify({product:'TrustMesh AI',exported_at:new Date().toISOString(),decision:state.result},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`trustmesh-decision-${state.result.event.id.slice(-8)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function audit(){return`<div>${title('VERIFIABLE HISTORY','Audit Center','Tamper-evident local ledger for simulated decisions.')}<div class="content"><div class="card"><div class="sectionhead"><div><h3>Decision ledger</h3><p>${state.events.length} stored event${state.events.length===1?'':'s'} • newest first</p></div><div class="toolbar"><button id="verifyLatest" class="btn">Verify latest</button><button id="clear" class="btn">Clear demo data</button></div></div>${state.events.length?state.events.map(e=>`<div class="audit"><div><strong>${e.decision}</strong><small>$${Number(e.amount).toLocaleString()} • score ${e.score}/100 • ${e.confidence}%</small></div><div class="hash">${e.hash}</div><div><small>${new Date(e.time).toLocaleString()}</small><br>${scoreTag(e.decision)}</div></div>`).join(''):`<div class="notice">Run a fraud event first. Its decision, score, timestamp and hash will appear here.</div>`}</div><div class="grid three section">${info('Integrity','Recomputing the latest decision produces the same SHA-256 when the record is unchanged.')}${info('Explainability','The commitment includes the event, agent outputs, score, decision and confidence.')}${info('Production anchor','A production deployment can anchor commitments to a permissioned ledger, public chain or WORM storage.')}</div></div></div>`}
async function verifyLatest(){if(!state.events[0]){alert('No audit event exists yet.');return}const e=state.events[0];if(!state.result||state.result.event.id!==e.id){alert('Latest event is stored, but its full decision object is not loaded in this browser session.');return}await verify();location.hash='/decision'}
function architecture(){return`<div>${title('REFERENCE ARCHITECTURE','Architecture','Production-shaped TrustMesh topology: local intelligence, privacy boundary, policy separation, consensus and verifiable audit.')}<div class="content"><div class="grid three"><div class="card"><span class="kicker">01</span><h3>Institution node</h3><p>Transaction data, local features and institution-specific models stay inside the organization boundary.</p><div class="checkline"><span>Local inference</span><b class="ok">READY</b></div><div class="checkline"><span>Raw data export</span><b class="ok">0 B</b></div></div><div class="card"><span class="kicker">02</span><h3>Signal gateway</h3><p>Only policy-approved intelligence signals should cross the boundary in a production deployment.</p><div class="checkline"><span>Allowlist</span><b class="ok">ENFORCED</b></div><div class="checkline"><span>Secure aggregation</span><b class="warn">DESIGN READY</b></div></div><div class="card"><span class="kicker">03</span><h3>Consensus + audit</h3><p>Independent signals are combined by policy and committed to a verifiable decision record.</p><div class="checkline"><span>Consensus</span><b class="ok">LIVE DEMO</b></div><div class="checkline"><span>SHA-256</span><b class="ok">LIVE</b></div></div></div><div class="card section"><div class="sectionhead"><div><span class="kicker">DATA FLOW</span><h3>Move intelligence, not records</h3></div></div><div class="grid four">${['Local transaction','Fraud / Risk / Compliance','Approved signals','Policy + consensus'].map((x,i)=>`<div class="card"><span class="kicker">0${i+1}</span><h4>${x}</h4><p>${['Sensitive context stays local.','Agents reason independently.','Only permitted signals leave the node.','Action and commitment become auditable.'][i]}</p></div>`).join('')}</div></div><div class="card section"><h3>Production hardening map</h3><div class="grid four">${['mTLS + workload identity','Secure aggregation / DP','Signed model + policy versions','Permissioned/public audit anchor'].map((x,i)=>`<div class="checkline"><span>${x}</span><b class="warn">PHASE ${i+1}</b></div>`).join('')}</div></div></div></div>`}
function security(){return`<div>${title('SECURITY CENTER','Threat Model & Data Boundary','The MVP is deliberately browser-local and synthetic. This page makes the security posture explicit instead of implying controls that are not implemented.')}<div class="content"><div class="grid three">${info('Threat: data leakage','Current demo stores synthetic events in localStorage and makes no external transaction API calls.')}${info('Threat: tampering','Every decision has a SHA-256 commitment that can be recomputed and verified.')}${info('Threat: malicious node','The Enterprise control plane can simulate a node anomaly and quarantine it from consensus.')}</div><div class="card section"><div class="sectionhead"><div><h3>Security control matrix</h3><p>Current implementation vs production target</p></div></div>${[['Synthetic-only input','IMPLEMENTED','ok'],['No external API keys','IMPLEMENTED','ok'],['Browser-local persistence','IMPLEMENTED','ok'],['SHA-256 integrity proof','IMPLEMENTED','ok'],['Authentication / RBAC','PRODUCTION TARGET','warn'],['mTLS node identity','PRODUCTION TARGET','warn'],['Secure aggregation','PRODUCTION TARGET','warn'],['Differential privacy','PRODUCTION TARGET','warn'],['Immutable external ledger','PRODUCTION TARGET','warn']].map(x=>`<div class="checkline"><span>${x[0]}</span><b class="${x[2]}">${x[1]}</b></div>`).join('')}</div></div></div>`}
function enterprise(){const m=state.mesh;return`<div>${title('ENTERPRISE CONTROL PLANE','TrustMesh Operating Layer','Operate the simulated mesh: run consensus rounds, detect a node anomaly, quarantine it and preserve an incident trail.')}<div class="content"><div class="toolbar"><button class="btn primary" id="meshRun">Run mesh round</button><button class="btn" id="meshAttack">Simulate node anomaly</button><button class="btn" id="meshReset">Reset network</button><a class="btn" href="#/dashboard">Back to dashboard</a></div><div class="grid four section">${metric('Nodes',m.anomaly?'2/3':'3/3',m.anomaly?'Beta quarantined':'All nodes healthy')}${metric('Raw data moved','0 B','Boundary enforced')}${metric('Consensus',m.round?`ROUND ${m.round}`:'READY',m.anomaly?'Quarantine active':'Policy aware')}${metric('Integrity','SHA-256','Verifiable')}</div><div class="grid three section"><div class="card"><span class="kicker">NODE MESH</span><h3>Local intelligence</h3>${[['Alpha',92,'Fraud signal'],['Beta',74,'Risk signal'],['Gamma',61,'Compliance signal']].map(x=>`<div class="node" style="opacity:${m.anomaly&&x[0]==='Beta'?.55:1}"><div><strong><i class="node-dot"></i>Bank ${x[0]}</strong><small>${x[2]} • raw records retained locally</small><div class="bar" style="margin-top:8px"><span style="width:${x[1]}%"></span></div></div><span class="tag">${m.anomaly&&x[0]==='Beta'?'QUARANTINED':'ONLINE'}</span></div>`).join('')}</div><div class="card"><span class="kicker">PRIVACY & POLICY</span><h3>Guardrails</h3>${[['Data minimization','ENFORCED'],['Signal allowlist','ENFORCED'],['Policy version','v1.4.0'],['Human escalation','ENABLED'],['Secure aggregation','DESIGN READY'],['Differential privacy','DESIGN READY']].map(x=>`<div class="checkline"><span>${x[0]}</span><b class="${x[1].includes('READY')?'warn':'ok'}">${x[1]}</b></div>`).join('')}</div><div class="card"><span class="kicker">DECISION PIPELINE</span><h3>End-to-end lineage</h3><p>LOCAL DATA → AGENTS → SIGNALS → POLICY → CONSENSUS → AUDIT</p><div class="terminal" id="meshLog">${escapeHtml(m.log.join('\n'))}</div><div class="notice"><strong>${m.anomaly?'ANOMALY DETECTED':'NORMAL'}</strong> — ${m.anomaly?'Bank Beta is excluded from the current consensus round and the incident is preserved.':'All nodes are behaving normally. No raw-data exchange is detected.'}</div></div></div><div class="card section"><h3>Enterprise positioning</h3><p>TrustMesh is not claiming to outperform mature fraud engines on raw detection accuracy. Its differentiation is the coordination layer: collaborative intelligence with institution-controlled data, policy separation and verifiable decisions.</p></div></div></div>`}
function bind(){document.getElementById('menu')?.addEventListener('click',()=>document.getElementById('shell')?.classList.toggle('menu-open'));document.querySelectorAll('[data-preset]').forEach(b=>b.addEventListener('click',()=>preset(b.dataset.preset)));document.getElementById('run')?.addEventListener('click',()=>{state.form={amount:Number(document.getElementById('amount').value),country:document.getElementById('country').value,device:document.getElementById('device').value==='true',age:Number(document.getElementById('age').value),velocity:Number(document.getElementById('velocity').value)};runSimulation()});document.getElementById('verify')?.addEventListener('click',verify);document.getElementById('export')?.addEventListener('click',downloadJSON);document.getElementById('clear')?.addEventListener('click',()=>{if(confirm('Clear all local TrustMesh demo data?'))resetData()});document.getElementById('verifyLatest')?.addEventListener('click',verifyLatest);document.getElementById('meshRun')?.addEventListener('click',()=>{state.mesh.round++;state.mesh.log.push(`[MESH] Round ${state.mesh.round}: local signals received`);state.mesh.log.push('[POLICY] Signals accepted');state.mesh.log.push('[AUDIT] Commitment generated');state.mesh.log=state.mesh.log.slice(-8);save();render()});document.getElementById('meshAttack')?.addEventListener('click',()=>{state.mesh.anomaly=true;state.mesh.log.push('[GUARD] Bank Beta quarantined');state.mesh.log.push('[AUDIT] Incident recorded');state.mesh.log=state.mesh.log.slice(-8);save();render()});document.getElementById('meshReset')?.addEventListener('click',()=>{state.mesh={round:0,anomaly:false,log:['[BOOT] TrustMesh control plane ready','[POLICY] Approved signals only','[AUDIT] SHA-256 commitments enabled']};save();render()})}
function render(){state.route=route();let c;switch(state.route){case'dashboard':c=dashboard();break;case'simulation':c=simulation();break;case'agents':c=agentPage();break;case'decision':c=decision();break;case'audit':c=audit();break;case'architecture':c=architecture();break;case'security':c=security();break;case'enterprise':c=enterprise();break;default:c=overview()}document.getElementById('app').innerHTML=shell(c);bind()}
render();})();
</script>
</body>
</html>
